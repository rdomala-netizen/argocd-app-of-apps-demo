apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deploy
  namespace: product1-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: rdomala/product1-frontend:v1.0.0   # bump this tag to release
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: http://backend-svc:80/api/message   # in-cluster call, not via ingress
          ports:
            - containerPort: 4000
